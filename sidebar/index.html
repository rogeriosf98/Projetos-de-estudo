<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Sidebar</title>
</head>
<body>
    <nav id="sidebar">
        <div id="sidebar_content">

        </div>

        <div id="user">
            <img src="imagens/pexels-shvetsa-4588062.jpg" id="user_avatar" alt="Avatar">

            <p id="user_infos">
                <span class="itens-description">
                    Fulano de tal
                </span>
                <span class="item_description">
                    Lorem, ipsum 
                </span>
            </p>
        </div>

        <ul id="side_itens">
            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-chart-line"></i>
                    <span class="item-description">
                        dashboard
                    </span>
                </a>
            </li>

            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    <span class="item-description">
                        Usuários
                    </span>
                </a>
            </li>

            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-bell"></i>
                    <span class="item-description">
                        Notificações
                    </span>
                </a>
            </li>

            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-box"></i>
                    <span class="item-description">
                        Produtos
                    </span>
                </a>
            </li>

            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-image"></i>
                    <span class="item-description">
                        Imagens
                    </span>
                </a>
            </li>

            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    <span class="item-description">
                        Configurações
                    </span>
                </a>
            </li>
        </ul>

        <button id="open_btn">
            <i id="open_btn_icon" class="fa-solid fa-chevron-right"></i>
        </button>

        <div  id="logout">
            <button id="logout_btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="iten-descripton">
                    Logout
                </span>
            </button>
        </div>

    <main>
